name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - feat/v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  source_check:
    name: Check frontend source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect application source
        id: detect
        shell: bash
        run: |
          if [[ -f package-lock.json ]] &&
             [[ -n "$(git ls-files 'app/**' 'src/app/**' 'pages/**' 'src/pages/**')" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Frontend source and package-lock.json found"
          else
            if [[ "$GITHUB_REF" == refs/heads/develop ]]; then
              echo "V2 application source/package-lock.json is missing; refusing a successful empty CI" >&2
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Frontend source or package-lock.json is not ready; build checks are skipped"
          fi

  quality:
    name: Type check, test, and build
    needs: source_check
    if: needs.source_check.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
      NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_CLARITY_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Detect test files
        id: tests
        shell: bash
        run: |
          if git ls-files | grep -Eq '\.(test|spec)\.(ts|tsx|js|jsx)$'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        if: steps.tests.outputs.present == 'true'
        run: npm run test:ci

      - name: Build Next.js
        run: npm run build

      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js
          test -d .next/static

  # develop runs quality checks; V2 static publishing needs an application artifact contract.
  publish:
    name: Build and push frontend images
    needs: quality
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend and Nginx iamges
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          WEB_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
          GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NAVER_MAP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
          CLARITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # 센트리에서 개발·운영 에러를 나눠 보려고 브랜치로 환경을 정한다 (main 은 production, 그 외는 dev)
          SENTRY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          # 소스맵 업로드용 비밀 값 — build-arg 가 아니라 secret 으로만 넘겨 이미지에 남기지 않는다
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # 토큰 시크릿이 등록돼 있을 때만 소스맵 업로드용 secret 을 넘긴다(없으면 업로드만 건너뛰고 빌드는 그대로 된다)
          SECRET_ARGS=()
          if [[ -n "$SENTRY_AUTH_TOKEN" ]]; then
            SECRET_ARGS=(--secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN)
          fi

          docker build \
            --platform linux/amd64 \
            --file Dockerfile \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --build-arg NEXT_PUBLIC_NAVER_MAP_CLIENT_ID="$NAVER_MAP_CLIENT_ID" \
            --build-arg NEXT_PUBLIC_CLARITY_PROJECT_ID="$CLARITY_PROJECT_ID" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="$SENTRY_DSN" \
            --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT="$SENTRY_ENVIRONMENT" \
            --build-arg SENTRY_ORG="$SENTRY_ORG" \
            --build-arg SENTRY_PROJECT="$SENTRY_PROJECT" \
            --build-arg SENTRY_RELEASE="$GITHUB_SHA" \
            "${SECRET_ARGS[@]}" \
            --tag "$REGISTRY/$WEB_REPOSITORY:$GITHUB_SHA" \
            .

          docker build \
            --platform linux/amd64 \
            --file Dockerfile.nginx \
            --tag "$REGISTRY/$NGINX_REPOSITORY:$GITHUB_SHA" \
            .
      - name: Push frontend and Nginx iamges
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          WEB_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
        run: |
          docker push "$REGISTRY/$WEB_REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$NGINX_REPOSITORY:$GITHUB_SHA"
