name: Frontend CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  source_check:
    name: Check frontend source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect application source
        id: detect
        shell: bash
        run: |
          if [[ -f package-lock.json ]] &&
             [[ -n "$(git ls-files 'app/**' 'src/app/**' 'pages/**' 'src/pages/**')" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Frontend source and package-lock.json found"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Frontend source or package-lock.json is not ready; build checks are skipped"
          fi

  quality:
    name: Type check, test, and build
    needs: source_check
    if: needs.source_check.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Detect test files
        id: tests
        shell: bash
        run: |
          if git ls-files | grep -Eq '\.(test|spec)\.(ts|tsx|js|jsx)$'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        if: steps.tests.outputs.present == 'true'
        run: npm run test:ci

      - name: Build Next.js
        run: npm run build

      - name: Verify standalone output
        run: |
          test -f .next/standalone/server.js
          test -d .next/static

  publish:
    name: Build and push frontend images
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend and Nginx iamges
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          WEB_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
          MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          docker build \
            --platform linux/amd64 \
            --file Dockerfile \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$MAPS_API_KEY" \
            --tag "$REGISTRY/$WEB_REPOSITORY:$GITHUB_SHA" \
            .

          docker build \
            --platform linux/amd64 \
            --file Dockerfile.nginx \
            --tag "$REGISTRY/$NGINX_REPOSITORY:$GITHUB_SHA" \
            .
      - name: Push frontend and Nginx iamges
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          WEB_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          NGINX_REPOSITORY: ${{ vars.ECR_NGINX_REPOSITORY }}
        run: |
          docker push "$REGISTRY/$WEB_REPOSITORY:$GITHUB_SHA"
          docker push "$REGISTRY/$NGINX_REPOSITORY:$GITHUB_SHA"
      
