server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # certbot webroot 발급·갱신용. 마운트가 없으면 404만 난다
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # 기본값 1m이면 휴대폰 사진 업로드가 413. BE multipart 한도와 같이 맞춘다
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 기본값 60s면 BE가 느려지는 일반적인 경우(DB 지연 등)에 바로 504가 난다.
    # AI 코스 추천처럼 원래 오래 걸리는 동기 호출은 이걸 늘려도 근본 해결이 안 되니
    # BE 쪽에서 비동기(202+폴링)로 바꿔야 한다 — 이건 그 외 일반 요청들을 위한 안전 마진이다.
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://backend:8080$request_uri;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080$request_uri;
    }

    # BE가 서빙하는 업로드 이미지 (/public/profile/...)
    location ^~ /public/ {
        proxy_pass http://backend:8080$request_uri;
    }

    # Spring 서버 로그인(OAuth2) 시작·콜백 경로는 BE로 보낸다.
    # 콜백 처리가 끝나면 BE 가 accessToken 을 담아 FE 루트 주소로 직접 리다이렉트한다
    # (OidcLoginSuccessHandler) — FE 가 이 경로를 따로 가로챌 필요는 없다.
    location ^~ /oauth2/ {
        proxy_pass http://backend:8080$request_uri;
    }

    location ^~ /login/oauth2/ {
        proxy_pass http://backend:8080$request_uri;
    }

    location / {
        proxy_pass http://frontend:3000$request_uri;
    }
}
